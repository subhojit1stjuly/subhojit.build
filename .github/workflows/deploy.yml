# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [ "main" ]
  # Allows you to trigger this workflow manually from the Actions tab
  workflow_dispatch:
  # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Note: This workflow uses the latest stable version of the Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      # - uses: dart-lang/setup-dart@v1
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1.7.2

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli
        
      - name: Install Dependencies
        run: dart pub get
        
      - name: Build static site
        # This generates the static HTML/CSS/JS files
        run: jaspr build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Jaspr's default output directory for static builds
          path: 'build/jaspr'
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
          
    


