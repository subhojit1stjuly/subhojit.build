name: Enforce Dev Branch Source

on:
  pull_request:
    branches:
      - main # Change this to your target production branch if it's named differently

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch is dev
        run: |
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Incoming branch: $HEAD_BRANCH"
          
          if [ "$HEAD_BRANCH" != "dev" ]; then
            echo "❌ Error: Pull requests to 'main' are only allowed from the 'dev' branch."
            exit 1
          fi
          
          echo "✅ Source branch is valid."